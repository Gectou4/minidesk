name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire le frontend dans app/ui/
        run: |
          set -e
          npm ci --prefix frontend
          npm run build --prefix frontend
          # Copié dans app/ pour partir avec l'application (servi sous /ui/ par Apache)
          mkdir app/ui
          cp -r frontend/dist/. app/ui/

      - name: Générer env.json (configuration de l'application)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir deploy-config
          jq -n \
            --arg host "$DB_HOST" \
            --arg name "$DB_NAME" \
            --arg user "$DB_USER" \
            --arg pass "$DB_PASSWORD" \
            '{DB_HOST: $host, DB_PORT: "3306", MYSQL_DATABASE: $name, MYSQL_USER: $user, MYSQL_PASSWORD: $pass, APP_ENV: "production"}' \
            > deploy-config/env.json

      - name: Préparer la connexion SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh
          host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')
          printf '%s\n' "$SFTP_HOST_KEY" | tr -d '\r' | grep -v '^#' \
            | awk -v h="$host" 'NF >= 2 {print h, $(NF-1), $NF}' > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Envoyer l'application (app/)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_APP_DIR: ${{ vars.FTP_APP_DIR }}
        run: |
          set -e
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')
          lftp -u "$FTP_USERNAME,$LFTP_PASSWORD" "sftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
          mirror -R --only-newer --verbose ./app/ "$FTP_APP_DIR"
          EOF

      - name: Envoyer env.json (hors du dossier web)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')
          lftp -u "$FTP_USERNAME,$LFTP_PASSWORD" "sftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
          put -O ./ deploy-config/env.json
          EOF

      - name: Vérifier le site
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -e

          # Pendant l'envoi, le site change d'état quelques secondes (lftp remplace les
          # fichiers un par un) : on réessaie la vérification entière, pas seulement curl,
          # car une réponse 200 au contenu inattendu n'est pas relancée par --retry.
          verifier() {  # verifier <description> <commande> : 10 essais, 5 s d'écart
            local i
            for i in $(seq 1 10); do
              if bash -c "$2"; then
                return 0
              fi
              echo "Essai $i/10 échoué : $1" >&2
              sleep 5
            done
            echo "::error::$1"
            return 1
          }

          verifier "GET / doit répondre status ok" \
            'curl -fsS --max-time 10 "$PROD_URL/" | grep -q "\"status\": \"ok\""'
          verifier "GET /tickets doit répondre en JSON" \
            'curl -fsS --max-time 10 -D - -o /dev/null "$PROD_URL/tickets" | grep -qi "^content-type: application/json"'

          verifier "GET /ui/ doit servir le frontend" \
            'curl -fsS --max-time 10 "$PROD_URL/ui/" | grep -q "id=\"root\""'

          # La configuration ne doit pas être accessible depuis le web
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/env.json")
          test "$code" != 200
