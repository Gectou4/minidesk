name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la configuration
        run: |
          cp .env.example .env
          # Mots de passe jetables : la CI n'a pas besoin des vrais secrets
          openssl rand -hex 16 | tr -d '\n' > secrets/db_password.txt
          openssl rand -hex 16 | tr -d '\n' > secrets/db_root_password.txt

      - name: Démarrer la stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Lancer les tests PHPUnit
        run: docker compose run --rm phpunit

      - name: Vérifier l'API
        run: |
          set -e
          base=http://localhost:8080

          curl -fsS "$base/" | grep -q '"status": "ok"'
          curl -fsS -D - -o /dev/null "$base/tickets" | grep -qi '^content-type: application/json'
          curl -fsS "$base/tickets" | grep -q '"id"'
          curl -fsS "$base/tickets/1" | grep -q '"id": 1'

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/tickets/999999")
          test "$code" = 404

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/tickets" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Ticket CI","description":"Created by CI","priority":"low"}')
          test "$code" = 201

          # Corps rejeté (422) à la création
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/tickets" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Ticket CI","priority":"urgent"}')
          test "$code" = 422

          # PATCH statut et priorité : code HTTP seul, corps JSON en second argument
          patch() { curl -s -o /dev/null -w '%{http_code}' -X PATCH "$base/tickets/$1" \
            -H 'Content-Type: application/json' -d "$2"; }

          curl -fsS -X PATCH "$base/tickets/1/status" \
            -H 'Content-Type: application/json' \
            -d '{"status":"in_progress"}' | grep -q '"status": "in_progress"'
          curl -fsS -X PATCH "$base/tickets/1/priority" \
            -H 'Content-Type: application/json' \
            -d '{"priority":"low"}' | grep -q '"priority": "low"'

          test "$(patch 1/status '{"status":"nimporte_quoi"}')" = 422
          test "$(patch 1/status '{}')" = 422
          test "$(patch 999999/status '{"status":"open"}')" = 404
          test "$(patch 1/priority '{"priority":"urgent"}')" = 422
          test "$(patch 1/priority '{}')" = 422
          test "$(patch 999999/priority '{"priority":"low"}')" = 404

          # 405 avec en-tête Allow quand la route existe mais pas la méthode ; 404 sinon
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$base/tickets/1")" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$base/tickets/1/status")" = 405
          curl -s -D - -o /dev/null -X PATCH "$base/tickets" | grep -qi '^allow: GET, POST'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/nimporte")" = 404

          # Filtres et pagination de GET /tickets
          curl -fsS -D - -o /dev/null "$base/tickets?limit=2" | grep -qi '^x-total-count: [0-9]'
          test "$(curl -fsS "$base/tickets?limit=2" | grep -c '"id"')" = 2
          curl -fsS "$base/tickets?status=in_progress" | grep -q '"id": 1,'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/tickets?status=nimporte")" = 422
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/tickets?limit=0")" = 422

          # Corps trop volumineux : 413 en JSON (limite nginx de 512 Kio)
          headers=$(head -c 600000 /dev/zero | tr '\0' 'a' | curl -s -D - -o /dev/null -X POST "$base/tickets" \
            -H 'Content-Type: application/json' --data-binary @-)
          echo "$headers" | head -1 | grep -q ' 413 '
          echo "$headers" | grep -qi '^content-type: application/json'

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
