version: '3.9'

# ⚠️ BUG #5 : le port exposé sur l'hôte est 8080, mais le service nginx écoute
#             sur le port 80 à l'intérieur du container.
#             Le mapping "8080:8080" est incorrect — corrigez-le.

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build: .
    volumes:
      - ./app:/var/www/html:ro
    env_file:
      - .env
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$(cat $$MYSQL_ROOT_PASSWORD_FILE)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

volumes:
  db_data:
